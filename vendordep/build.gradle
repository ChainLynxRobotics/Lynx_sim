import org.wpilib.toolchain.*

plugins {
  id 'cpp'
  id 'java'
  id 'google-test'
  id 'org.wpilib.WPILibRepositoriesPlugin' version '2027.0.0'
  id 'org.wpilib.NativeUtils' version '2027.13.1'
  id 'org.wpilib.GradleJni' version '2027.0.0'
  id 'org.wpilib.GradleVsCode' version '2027.0.0'
}

// WPILib Version
ext.wpilibVersion = "2027.+"

repositories {
  mavenCentral()
  maven {
    url = uri("${project.getRootDir()}/../target/zips")
  }
}
wpilibRepositories.use2027Repos()
if (project.hasProperty('releaseMode')) {
  wpilibRepositories.addAllReleaseRepositories(project)
} else {
  wpilibRepositories.addAllDevelopmentRepositories(project)
}

var javaVersion = 25

// Apply C++ configuration
apply from: 'config.gradle'

// Apply Java configuration
dependencies {
    annotationProcessor "io.avaje:avaje-jsonb-generator:3.11"
    implementation "io.avaje:avaje-jsonb:3.11"
    implementation "org.wpilib.cscore:cscore-java:$wpilibVersion"
    implementation "org.wpilib.cameraserver:cameraserver-java:$wpilibVersion"
    implementation "org.wpilib.ntcore:ntcore-java:$wpilibVersion"
    implementation "org.wpilib.wpilibj:wpilibj-java:$wpilibVersion"
    implementation "org.wpilib.wpiutil:wpiutil-java:$wpilibVersion"
    implementation "org.wpilib.wpimath:wpimath-java:$wpilibVersion"
    implementation "org.wpilib.wpiunits:wpiunits-java:$wpilibVersion"
    implementation "org.wpilib.datalog:datalog-java:$wpilibVersion"
    implementation "org.wpilib.hal:hal-java:$wpilibVersion"
    implementation "org.ejml:ejml-simple:0.44.0"
    implementation 'org.wpilib.thirdparty.opencv:opencv-java:2027-4.13.0-3'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'us.hebi.quickbuf:quickbuf-runtime:1.4'
}

// Set up java tests
test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    testLogging {
        events "failed"
        exceptionFormat = "full"
    }
}

if (project.hasProperty('onlylinuxarm64') || project.hasProperty('onlywindowsarm64') || project.hasProperty('onlylinuxsystemcore')) {
    test.enabled = false
}

tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
    options.encoding = 'UTF-8'
    options.release = javaVersion
}

// Setup Javadocs to link back to WPILib docs
javadoc {
    options {
        links "https://docs.oracle.com/en/java/javase/$javaVersion/docs/api/", 'https://github.wpilib.org/allwpilib/docs/release/java/'
    }
}

// Set up exports properly
nativeUtils {
  exportsConfigs {
    // Main library is just default empty. This will export everything
    Lynx_sim {
    }
  }

  nativeDependencyContainer {
    libswerve_sim_3d(getNativeDependencyTypeClass('WPISharedMavenDependency')) {
      version = "2027.0.0"
      groupId = "com.chainlynx8248"
      artifactId = "libswerve_sim_3d"
      ext = "zip"

      targetPlatforms = [
        "windowsx86-64",
        "windowsarm64",
        "linuxarm64",
        "linuxx86-64",
        "linuxarm32",
        "osxuniversal"
      ]
    }
  }
}

ext.getCurrentArch = {
    return NativePlatforms.desktop
}

def systemArch = getCurrentArch()

model {
  components {
    Lynx_sim(NativeLibrarySpec) {
      sources {
        cpp {
          source {
            srcDirs 'src/main/native/cpp'
            include '**/*.cpp'
          }
          exportedHeaders {
            srcDirs 'src/main/native/include'
          }
        }
      }
      nativeUtils.useRequiredLibrary(it, 'libswerve_sim_3d')
    }
  }
  testSuites {
    Lynx_simTest {
        sources.cpp {
            source {
                srcDir 'src/test/native/cpp'
                include '**/*.cpp'
            }
        }

        binaries.all {
          def arch = it.targetPlatform.name
          if (systemArch == arch && it.buildType.name == 'debug') {
            def filePath = it.tasks.install.installDirectory.get().toString() + File.separatorChar + 'lib'
            test.dependsOn it.tasks.install
            test.dependsOn copyRustLibsForTests
            test.systemProperty 'java.library.path', filePath
            test.environment 'LD_LIBRARY_PATH', filePath
            test.workingDir filePath
          }
        }

        nativeUtils.useRequiredLibrary(it, "libswerve_sim_3d", "googletest_static")
    }
  }
}

def rust_triple(targetPlatform) {
  def platformName = targetPlatform
  if (platformName == "linuxathena") {
    return "arm-unknown-linux-gnueabi"
  } else if (platformName == "linuxarm32") {
    return "arm-unknown-linux-gnueabihf"
  } else if (platformName == "linuxarm64") {
    return "aarch64-unknown-linux-gnu"
  } else if (platformName == "linuxx86-64") {
    return "x86_64-unknown-linux-gnu"
  } else if (platformName == "osxuniversal") {
    return "aarch64-apple-darwin"
  } else if (platformName == "windowsx86-64") {
    return "x86_64-pc-windows-msvc"
  } else if (platformName == "windowsarm64") {
    return "aarch64-pc-windows-msvc"
  } else {
      println "Unknown target platform $platformName"
      return null
  }
}

import java.nio.file.Files;
import java.nio.file.StandardCopyOption;

task copyRustLibsForTests() {
  def rustTriple = rust_triple(systemArch)
  def outdir = "libs/swerve_sim_3d/"
  def sharedOutDir = project.getLayout().getBuildDirectory().dir(outdir + "shared/${systemArch}/release") 
  def staticOutDir = project.getLayout().getBuildDirectory().dir(outdir + "static/${systemArch}/debug") 
  def indir = "../target/${rustTriple}/";
  copy {
    from project.getLayout().getProjectDirectory().dir(indir + "release-full/libswerve_sim_3d.so")
    into sharedOutDir
  }
  copy {
    from project.getLayout().getProjectDirectory().dir(indir + "debug/libswerve_sim_3d.so")
    into staticOutDir
  }
}

apply from: 'publish.gradle'

wrapper {
  gradleVersion = '9.4.1'
}
