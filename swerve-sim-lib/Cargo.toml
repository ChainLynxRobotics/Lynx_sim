[package]
name = "swerve-sim-3d"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib", "staticlib"]


[dependencies]
culit = "0.6.7"
ipc-channel = "0.22.0"
rapier3d = { version = "0.35.1", features = ["debug-render"] }
serde = "1.0.228"
whippyunits = "0.2.6"
ipc-types = { path = "../ipc-types" }
rapier3d-meshloader = { version = "0.35.1", default-features = false, features = [ "stl" ] }
jni = "0.22.4"
include_dir = "0.7.4"
[features]
default = ["debug_renderer"]
debug_renderer = []
distribution = []
